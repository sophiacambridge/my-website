<!DOCTYPE html>
<html>
<head>
    <title>Sophia의 홈페이지</title>
    <style>
        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-top: 50px;
            margin: 0;
            min-height: 100vh;
        }
        h1 {
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
        }
        h2 {
            color: #f39c12;
            margin-top: 0;
        }
        p {
            font-size: 18px;
            color: #e0e0e0;
        }
        .section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin: 25px auto;
            padding: 30px;
            width: 75%;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .btn {
            display: inline-block;
            background: linear-gradient(to right, #f39c12, #f1c40f);
            color: #000;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.4);
        }
    </style>
</head>
<body>
    <h1>안녕하세요! Sophia의 홈페이지에 오신 것을 환영합니다.</h1>
    <p>제가 좋아하는 것들과 활동을 소개하는 고급스러운 공간이에요.</p>
    
    <div class="section">
        <h2>🎵 좋아하는 음악</h2>
        <p>보이넥스트도어(BOYNEXTDOOR)를 정말 좋아해요! 노래도 좋고 무대도 멋지답니다.</p>
        <a class="btn" href="https://www.youtube.com/results?search_query=BOYNEXTDOOR" target="_blank">유튜브에서 보넥도 검색하기</a>
    </div>

    <div class="section">
        <h2>👑 학생회장 활동</h2>
        <p>반에서 학생회장으로서 친구들과 함께 즐거운 학급 회의를 이끌고 있어요.</p>
        <a class="btn" href="http://myongdok.sen.es.kr/" target="_blank">명덕초등학교 바로가기</a>
    </div>

    <div class="section">
        <h2>💃 취미 및 관심사</h2>
        <p>방과후 수업으로 방송댄스를 즐기고 있으며, 앞으로 방송반에도 들어가고 싶어요.</p>
        <a class="btn" href="https://search.naver.com/search.naver?query=초등학생+인기+검색어" target="_blank">네이버에서 관심사 검색하기</a>
    </div>
</body>
</html>
